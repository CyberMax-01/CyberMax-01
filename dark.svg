    <text x="0" y="135" font-size="15" fill="#86EFAC">▸ Build. Break. Learn.</text>
    <text x="0" y="160" font-size="15" fill="#86EFAC">▸ Contact: CyberMax@example.com</text>
    <text x="0" y="195" font-size="13" fill="#22C55E">█████████████████████████████</text>
    <text x="0" y="220" font-size="13" fill="#22C55E">█ profile banner ▸ COD Ghost █</text>
    <text x="0" y="245" font-size="13" fill="#22C55E">█████████████████████████████</text>
