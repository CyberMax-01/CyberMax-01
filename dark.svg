<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CyberMax_01" width="1500" height="500" viewBox="0 0 1500 500" font-family="ui-monospace,Menlo,Consolas,Liberation Mono,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#07123A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"><animate attributeName="stop-color" values="#2563EB;#06B6D4;#10B981;#2563EB" dur="10s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#06B6D4"><animate attributeName="stop-color" values="#06B6D4;#10B981;#2563EB;#06B6D4" dur="10s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#10B981"><animate attributeName="stop-color" values="#10B981;#2563EB;#06B6D4;#10B981" dur="10s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <clipPath id="winClip"><rect x="2" y="2" width="1496" height="496" rx="18"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1500" height="500" fill="url(#bg)"/>
  <image href="assets/ghost-candidate.png" x="60" y="80" height="340" preserveAspectRatio="xMidYMid meet"/>
  <g transform="translate(980,90)">
    <text x="0" y="0" font-size="34" fill="#00ff41" font-weight="bold">CyberMax_01</text>
