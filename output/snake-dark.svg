<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="CyberMax contribution snake">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A101F"/>
      <stop offset="1" stop-color="#05080F"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white">
        <animate attributeName="offset" values="-0.3;1.3" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="15%" stop-color="white" stop-opacity="0.8">
        <animate attributeName="offset" values="-0.15;1.45" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="16%" stop-color="white" stop-opacity="0">
        <animate attributeName="offset" values="-0.14;1.46" dur="2s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect x="2" y="2" width="896" height="266" rx="12" fill="url(#bg)"/>
  <rect x="2" y="2" width="896" height="36" rx="12" fill="#0B1222"/>
  <rect x="2" y="38" width="896" height="1" fill="#1E293B"/>
  <circle cx="20" cy="20" r="4" fill="#EF4444"/>
  <circle cx="32" cy="20" r="4" fill="#F59E0B"/>
  <circle cx="44" cy="20" r="4" fill="#10B981"/>
  <text x="450" y="25" text-anchor="middle" font-size="12" fill="#64748B">cybermax@ghostops — snake — active</text>
  <text x="24" y="62" font-size="13" fill="#22D3EE">$ ./feed_snake.sh —slither</text>

  <rect x="14" y="78" width="872" height="148" rx="6" fill="#05080F"/>

  <g transform="translate(30, 92)">
    <!-- Grid cells -->
    <rect x="0" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="18" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="36" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="54" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="72" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="90" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="108" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="126" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="144" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="162" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="180" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="198" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="216" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="234" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="252" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="270" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="288" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="306" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="324" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="342" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="360" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="378" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="396" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="414" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="432" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="450" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="468" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="486" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="504" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="522" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="540" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="558" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="576" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="594" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="612" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="630" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="648" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="666" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="684" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="702" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="720" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="738" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="756" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="774" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="792" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="810" y="0" width="16" height="14" rx="3" fill="#1E293B"/>
    <rect x="828" y="0" width="16" height="14" rx="3" fill="#1E293B"/>

    <!-- Feeding cells (light up one by one) -->
    <rect x="72" y="0" width="16" height="14" rx="3" fill="#22D3EE" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="198" y="0" width="16" height="14" rx="3" fill="#10B981" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="324" y="0" width="16" height="14" rx="3" fill="#A78BFA" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="450" y="0" width="16" height="14" rx="3" fill="#22D3EE" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="576" y="0" width="16" height="14" rx="3" fill="#10B981" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="702" y="0" width="16" height="14" rx="3" fill="#A78BFA" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="828" y="0" width="16" height="14" rx="3" fill="#22D3EE" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="3s" repeatCount="indefinite"/>
    </rect>

    <!-- Solid snake body (always visible) -->
    <path d="M85 7 Q94 -5 103 7 Q112 19 121 7 Q130 -5 139 7 Q148 19 157 7 Q166 -5 175 7 Q184 19 193 7 Q202 -5 211 7 Q220 19 229 7 Q238 -5 247 7 Q256 19 265 7 Q274 -5 283 7 Q292 19 301 7 Q310 -5 319 7 Q328 19 337 7 Q346 -5 355 7 Q364 19 373 7 Q382 -5 391 7 Q400 19 409 7 Q418 -5 427 7 Q436 19 445 7 Q454 -5 463 7 Q472 19 481 7 Q490 -5 499 7 Q508 19 517 7 Q526 -5 535 7 Q544 19 553 7 Q562 -5 571 7 Q580 19 589 7 Q598 -5 607 7 Q616 19 625 7 Q634 -5 643 7 Q652 19 661 7 Q670 -5 679 7 Q688 19 697 7 Q706 -5 715 7 Q724 19 733 7 Q742 -5 751 7 Q760 19 769 7 Q778 -5 787 7 Q796 19 805 7 Q814 -5 823 7 Q832 19 841 7" stroke="url(#bodyGrad)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Moving glow highlight (creates slither illusion) -->
    <path d="M85 7 Q94 -5 103 7 Q112 19 121 7 Q130 -5 139 7 Q148 19 157 7 Q166 -5 175 7 Q184 19 193 7 Q202 -5 211 7 Q220 19 229 7 Q238 -5 247 7 Q256 19 265 7 Q274 -5 283 7 Q292 19 301 7 Q310 -5 319 7 Q328 19 337 7 Q346 -5 355 7 Q364 19 373 7 Q382 -5 391 7 Q400 19 409 7 Q418 -5 427 7 Q436 19 445 7 Q454 -5 463 7 Q472 19 481 7 Q490 -5 499 7 Q508 19 517 7 Q526 -5 535 7 Q544 19 553 7 Q562 -5 571 7 Q580 19 589 7 Q598 -5 607 7 Q616 19 625 7 Q634 -5 643 7 Q652 19 661 7 Q670 -5 679 7 Q688 19 697 7 Q706 -5 715 7 Q724 19 733 7 Q742 -5 751 7 Q760 19 769 7 Q778 -5 787 7 Q796 19 805 7 Q814 -5 823 7 Q832 19 841 7" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="40 800" opacity="0.6" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="840;-800" dur="1.5s" repeatCount="indefinite"/>
    </path>

    <!-- Snake head -->
    <circle cx="841" cy="7" r="7" fill="#22D3EE" filter="url(#glow)">
      <animate attributeName="r" values="6;9;6" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#22D3EE;#10B981;#A78BFA;#22D3EE" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="841" cy="7" r="3" fill="white" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="841" cy="3" r="5" fill="white" opacity="0.15" filter="url(#glow)">
      <animate attributeName="opacity" values="0.15;0.3;0.15" dur="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(24, 240)">
    <text font-size="11" fill="#64748B">▸ contributions feed the snake. keep coding.</text>
    <text font-size="11" fill="#64748B" x="680" y="0">$</text>
    <text font-size="11" fill="#22D3EE" x="700" y="0" filter="url(#glowSoft)">
      _
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
