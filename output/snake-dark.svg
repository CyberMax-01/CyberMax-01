<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="CyberMax contribution snake">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A101F"/>
      <stop offset="1" stop-color="#05080F"/>
    </linearGradient>
    <linearGradient id="snakeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#10B981;#A78BFA;#22D3EE" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#A78BFA;#22D3EE;#10B981" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#22D3EE;#10B981;#A78BFA" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect x="2" y="2" width="896" height="266" rx="12" fill="url(#bg)"/>
  <rect x="2" y="2" width="896" height="36" rx="12" fill="#0B1222"/>
  <rect x="2" y="38" width="896" height="1" fill="#1E293B"/>
  <circle cx="20" cy="20" r="4" fill="#EF4444"/>
  <circle cx="32" cy="20" r="4" fill="#F59E0B"/>
  <circle cx="44" cy="20" r="4" fill="#10B981"/>
  <text x="450" y="25" text-anchor="middle" font-size="12" fill="#64748B">cybermax@ghostops — snake — active</text>

  <text x="24" y="62" font-size="13" fill="#22D3EE">$ ./feed_snake.sh —animate</text>

  <rect x="14" y="78" width="872" height="148" rx="6" fill="#05080F"/>

  <g transform="translate(30, 92)">
    <rect x="0" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="17" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="34" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="51" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="68" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="85" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="102" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="119" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="136" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="153" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="170" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="187" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="204" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="221" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="238" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="255" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="272" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="289" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="306" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="323" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="340" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="357" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="374" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="391" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="408" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="425" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="442" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="459" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="476" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="493" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="510" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="527" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="544" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="561" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="578" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="595" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="612" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="629" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="646" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="663" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="680" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="697" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="714" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="731" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="748" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="765" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="782" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="799" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="816" y="0" width="13" height="13" rx="3" fill="#1E293B"/>
    <rect x="833" y="0" width="13" height="13" rx="3" fill="#1E293B"/>

    <!-- Feeding cells (light up in sequence) -->
    <rect x="68" y="0" width="13" height="13" rx="3" fill="#22D3EE" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="187" y="0" width="13" height="13" rx="3" fill="#10B981" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="306" y="0" width="13" height="13" rx="3" fill="#A78BFA" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="425" y="0" width="13" height="13" rx="3" fill="#22D3EE" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="544" y="0" width="13" height="13" rx="3" fill="#10B981" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="663" y="0" width="13" height="13" rx="3" fill="#A78BFA" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="782" y="0" width="13" height="13" rx="3" fill="#22D3EE" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="3s" repeatCount="indefinite"/>
    </rect>

    <!-- Animated snake body (crawling effect) -->
    <path d="M0 7 L833 7" stroke="url(#snakeGrad)" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="20 10">
      <animate attributeName="stroke-dashoffset" values="0;-30" dur="0.8s" repeatCount="indefinite"/>
    </path>

    <!-- Snake head glow -->
    <circle cx="833" cy="7" r="5" fill="#22D3EE" filter="url(#glow)">
      <animate attributeName="r" values="5;7;5" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#22D3EE;#10B981;#A78BFA;#22D3EE" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="833" cy="7" r="3" fill="white" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1s" repeatCount="indefinite"/>
    </circle>

    <!-- Trail particles -->
    <circle cx="800" cy="4" r="2" fill="#22D3EE" opacity="0">
      <animate attributeName="opacity" values="0.6;0" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="800;785" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="770" cy="10" r="1.5" fill="#10B981" opacity="0">
      <animate attributeName="opacity" values="0.5;0" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="770;755" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="4" r="1.5" fill="#A78BFA" opacity="0">
      <animate attributeName="opacity" values="0.4;0" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="740;725" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(24, 240)">
    <text font-size="11" fill="#64748B">▸ Nom nom nom... contributions feed the snake</text>
    <text font-size="11" fill="#64748B" x="680">█</text>
    <text font-size="11" fill="#22D3EE" x="692" filter="url(#glowSoft)">
      █
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
