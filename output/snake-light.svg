    <rect x="816" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="833" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>

    <!-- Feeding cells (light up in sequence) -->
    <rect x="68" y="0" width="13" height="13" rx="3" fill="#0891B2" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="187" y="0" width="13" height="13" rx="3" fill="#059669" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="306" y="0" width="13" height="13" rx="3" fill="#7C3AED" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="425" y="0" width="13" height="13" rx="3" fill="#0891B2" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="544" y="0" width="13" height="13" rx="3" fill="#059669" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="663" y="0" width="13" height="13" rx="3" fill="#7C3AED" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="782" y="0" width="13" height="13" rx="3" fill="#0891B2" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="3s" repeatCount="indefinite"/>
    </rect>

    <!-- Animated snake body (crawling effect) -->
    <path d="M85 7 Q93 -3 102 7 Q110 17 119 7 Q128 -3 136 7 Q145 17 153 7 Q162 -3 170 7 Q179 17 187 7 Q196 -3 204 7 Q213 17 221 7 Q230 -3 238 7 Q247 17 255 7 Q264 -3 272 7 Q281 17 289 7 Q298 -3 306 7 Q315 17 323 7 Q332 -3 340 7 Q349 17 357 7 Q366 -3 374 7 Q383 17 391 7 Q400 -3 408 7 Q417 17 425 7 Q434 -3 442 7 Q451 17 459 7 Q468 -3 476 7 Q485 17 493 7 Q502 -3 510 7 Q519 17 527 7 Q536 -3 544 7 Q553 17 561 7 Q570 -3 578 7 Q587 17 595 7 Q604 -3 612 7 Q621 17 629 7 Q638 -3 646 7 Q655 17 663 7 Q672 -3 680 7 Q689 17 697 7 Q706 -3 714 7 Q723 17 731 7 Q740 -3 748 7 Q757 17 765 7 Q774 -3 782 7 Q791 17 799 7 Q808 -3 816 7 Q825 17 833 7" stroke="url(#snakeGrad)" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="10 14">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="0.6s" repeatCount="indefinite"/>
    </path>

    <!-- Snake head glow -->
    <circle cx="833" cy="7" r="5" fill="#0891B2" filter="url(#glow)">
      <animate attributeName="r" values="5;7;5" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#0891B2;#059669;#7C3AED;#0891B2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="833" cy="7" r="3" fill="white" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1s" repeatCount="indefinite"/>
    </circle>

    <!-- Trail particles -->
    <circle cx="800" cy="4" r="2" fill="#0891B2" opacity="0">
      <animate attributeName="opacity" values="0.6;0" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="800;785" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="770" cy="10" r="1.5" fill="#059669" opacity="0">
      <animate attributeName="opacity" values="0.5;0" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="770;755" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="4" r="1.5" fill="#7C3AED" opacity="0">
      <animate attributeName="opacity" values="0.4;0" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="740;725" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(24, 240)">
    <text font-size="11" fill="#94A3B8">▸ Nom nom nom... contributions feed the snake</text>
    <text font-size="11" fill="#94A3B8" x="680">█</text>
    <text font-size="11" fill="#0891B2" x="692" filter="url(#glowSoft)">
      █
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </text>
  </g>
