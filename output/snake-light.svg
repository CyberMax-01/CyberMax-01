    <rect x="289" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="306" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="323" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="340" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="357" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="374" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="391" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="408" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="425" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="442" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="459" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="476" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="493" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="510" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="527" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="544" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="561" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="578" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="595" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="612" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="629" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="646" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="663" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="680" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="697" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
