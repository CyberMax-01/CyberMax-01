<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="CyberMax contribution snake">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="snakeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891B2">
        <animate attributeName="stop-color" values="#0891B2;#059669;#7C3AED;#0891B2" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#059669">
        <animate attributeName="stop-color" values="#059669;#7C3AED;#0891B2;#059669" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#0891B2;#059669;#7C3AED" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoft"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect x="2" y="2" width="896" height="266" rx="12" fill="url(#bg)"/>
  <rect x="2" y="2" width="896" height="36" rx="12" fill="#F1F5F9"/>
  <rect x="2" y="38" width="896" height="1" fill="#CBD5E1"/>
  <circle cx="20" cy="20" r="4" fill="#EF4444"/>
  <circle cx="32" cy="20" r="4" fill="#F59E0B"/>
  <circle cx="44" cy="20" r="4" fill="#10B981"/>
  <text x="450" y="25" text-anchor="middle" font-size="12" fill="#64748B">cybermax@ghostops — snake — active</text>

  <text x="24" y="62" font-size="13" fill="#0891B2">$ ./feed_snake.sh —animate</text>

  <rect x="14" y="78" width="872" height="148" rx="6" fill="white"/>

  <g transform="translate(30, 92)">
    <rect x="0" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="17" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="34" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
