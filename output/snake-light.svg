    <rect x="136" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="153" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="170" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="187" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="204" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="221" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
    <rect x="238" y="0" width="13" height="13" rx="3" fill="#E2E8F0"/>
